name: Test and publish

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: 
      - "**"
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Build
        id: pack-dir
        run: ./build.sh
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: reactfire-${{ github.run_id }}
          path: |
            reactfire.tgz
            publish.sh
            unpack.sh
          retention-days: 1
  verify-package:
    runs-on: ubuntu-latest
    needs: build
    name: Verify published package
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: 'Download Artifacts'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      # Off-the-shelf checks on the packed tarball the publish job uploads
      # verbatim, so these verify the exact bytes that ship.
      #
      # publint checks the manifest and file formats; attw checks that the
      # published types resolve under every module-resolution mode. Both found
      # real consumer-facing bugs on the first run, neither of which a bespoke
      # check had noticed.
      - name: publint
        run: npx publint reactfire-${{ github.run_id }}/reactfire.tgz
      # `internal-resolution-error` is ignored because the emitted .d.ts use
      # extensionless relative imports (16 of them, from 10 source files), which
      # node16 resolution rejects. That is a real pre-existing bug and its own
      # fix; ignoring the rule keeps every other resolution check enforcing.
      - name: attw
        run: npx attw --pack reactfire-${{ github.run_id }}/reactfire.tgz --ignore-rules internal-resolution-error
      - name: Bundle size
        run: npm run size

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node: ["22", "24"]
      fail-fast: false
    name: Test Node.js ${{ matrix.node }} (Ubuntu)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps for functions
        run: npm install
        working-directory: ./functions
      - name: Firebase emulator cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase_emulators
      - name: 'Download Artifacts'
        uses: actions/download-artifact@v4
      - name: Expand Artifact
        run: |
          chmod +x reactfire-${{ github.run_id }}/unpack.sh
          ./reactfire-${{ github.run_id }}/unpack.sh
      - name: Run tests
        run: npm run test
  type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: ["18", "19"]
      fail-fast: false
    name: Type check (React ${{ matrix.react }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Install React ${{ matrix.react }} types
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - name: Type check
        run: npx tsc --noEmit
      - name: Type check tests
        run: npx tsc --noEmit -p tsconfig.test.json
  publish:
    runs-on: ubuntu-latest
    name: Publish (NPM)
    needs: [test, verify-package]
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}
    steps:
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://wombat-dressing-room.appspot.com'
      - name: 'Download Artifacts'
        uses: actions/download-artifact@v4
      - name: Publish
        run: |
          cd ./reactfire-${{ github.run_id }}/
          chmod +x publish.sh
          ./publish.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
